version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres_locked_saving
    environment:
      POSTGRES_DB: locked_saving_db
      POSTGRES_USER: saving
      POSTGRES_PASSWORD: 123

    ports:
      - "5432:5432"
    volumes:
      - locked_saving_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saving"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: locked-saving-backend
    container_name: locked_saving_backend
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/locked_saving_db
      SPRING_DATASOURCE_USERNAME: saving
      SPRING_DATASOURCE_PASSWORD: 123


volumes:
  locked_saving_postgres_data: